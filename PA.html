<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Личный кабинет</title>
        <link rel="stylesheet" href="PA.css">
    </head>
    <body>

        <div class="header">
            <span>Личный кабинет сотрудника</span>
            <div class="header-right">
                <span id="user-name"></span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="salary-block">
            <span>Мои продажи: </span>
        </div>

        <div class="history">

            <div class="history-header">
                <h2>История сделок</h2>
                <button class="add-btn" onclick="openModal()">+ Добавить</button>
            </div>

            <table class="deals-table">
                <thead>
                    <tr>
                        <th>ФИО клиента</th>
                        <th>Телефон</th>
                        <th>Номер заказа</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="deals-body">
                    <tr><td colspan="7">Загрузка...</td></tr>
                </tbody>
            </table>

        </div>

        <!-- Модальное окно добавления/редактирования -->
        <div id="modal" class="modal hidden">
            <div class="modal-box">
                <h3 id="modal-title">Новая сделка</h3>
                <input id="input-name" type="text" placeholder="ФИО клиента">
                <input id="input-phone" type="tel" placeholder="Телефон">
                <input id="input-order" type="text" placeholder="Номер заказа">
                <input id="input-price" type="number" placeholder="Сумма сделки">
                <div class="modal-buttons">
                    <button onclick="saveDeal()">Сохранить</button>
                    <button onclick="closeModal()">Отмена</button>
                </div>
            </div>
        </div>

        <script src="PA.js"></script>
    </body>
</html>
